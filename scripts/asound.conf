# /etc/asound.conf - 默认声卡指向 USB 声卡
# 原厂文件把默认设备指向 card 0 device 1、type hw，USB 声卡上打不开；这里改成 plug，
# 自动转换采样率 / 声道 / 格式（AB13X 录音只支持 48 kHz，程序要 16 kHz 单声道也能直接录）。
# 按声卡名字指定，不用编号：接了带麦克风的 USB 摄像头等设备时会多出声卡，开机时编号可能对调。
# Audio 是 AB13X 的名字；换别的声卡时改成 cat /proc/asound/card*/id 里它的名字。
pcm.!default {
    type plug
    slave.pcm "hw:Audio,0"
}
ctl.!default {
    type hw
    card Audio
}
